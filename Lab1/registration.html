<html>
	<head>
	<title>Registration</title>
	</head>
		<body>
			<h1>Welcome to registration page</h1>
			<p>Complete the form and click register to confirm you registration</p>
			<div>
				<form>
					<label for="fname">First name:</label><br>
					<input type="text" id="fname" name="fname"><br>s
					<label for="lname">Last name:</label><br>
					<input type="text" id="lname" name="lname"><br>
					<label for="username">User Name:</label><br>
  					<input type="text" id="username" name="username"><br>
					<label for="mblnum">Phone Number:</label><br>
  					<input type="tel" id="mblnum" name="mblnum"><br>
					<label for="dob">Date Of Birth:</label><br>
  					<input type="date" id="dob" name="dob"><br><br>
					  <label for="gen">Gender:</label>
						<select name="gen" id="gen">
						<option value="male">Male</option>
						<option value="female">Female</option>
						<option value="others">Others</option>
						</select><br><br>
					<label for="mail">Email:</label><br>
  					<input type="email" id="mail" name="mail"><br>
  					<label for="pass">Password:</label><br>
  					<input type="password" id="pass" name="pass"><br>
					<label for="cpass">Confirm Password:</label><br>
  					<input type="password" id="cpass" name="cpass"><br><br>
					<input type="submit" value="register">
				</form>
			</div>
		
		</body>
</html>
