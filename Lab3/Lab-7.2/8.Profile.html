<html>

<head>
    <title>Person Profile</title>
</head>

<body>

    <form onsubmit="return validate()">
        <table border="1" width="500" height="500" cellpadding="5">
            <tr>
                <th colspan="3" height="50">
                    <h2>PERSON PROFILE</h2>
                </th>
            </tr>

            <tr>
                <td width="100">Name</td>
                <td width="280"><input type="text" id="name" size="20" onblur="checkName()"></td>
                <td width="20"></td>
            </tr>

            <tr>
                <td>Email</td>
                <td><input type="email" id="email" size="20" onblur="checkEmail()"></td>
                <td></td>
            </tr>

            <tr>
                <td>Gender</td>
                <td>
                    <input type="radio" name="gender" value="male" onblur="checkGender()"> Male
                    <input type="radio" name="gender" value="female" onblur="checkGender()"> Female
                    <input type="radio" name="gender" value="other" onblur="checkGender()"> Other
                </td>
                <td></td>
            </tr>

            <tr>
                <td>Date of Birth</td>
                <td>
                    <input type="text" id="day" size="2" maxlength="2" onblur="checkDOB()"> /
                    <input type="text" id="month" size="2" maxlength="2" onblur="checkDOB()"> /
                    <input type="text" id="year" size="4" maxlength="4" onblur="checkDOB()">
                    <i>(dd/mm/yyyy)</i>
                </td>
                <td></td>
            </tr>

            <tr>
                <td>Blood Group</td>
                <td>
                    <select id="blood_group" onblur="checkBG()">
                        <option value="">Select</option>
                        <option value="A+">A+</option>
                        <option value="A-">A-</option>
                        <option value="B+">B+</option>
                        <option value="O+">O+</option>
                        <option value="O-">O-</option>
                        <option value="AB+">AB+</option>
                        <option value="AB-">AB-</option>
                    </select>
                </td>
                <td></td>
            </tr>

            <tr>
                <td>Degree</td>
                <td>
                    <input type="checkbox" name="degree" value="SSC" onblur="checkDegree()"> SSC
                    <input type="checkbox" name="degree" value="HSC" onblur="checkDegree()"> HSC
                    <input type="checkbox" name="degree" value="BSc" onblur="checkDegree()"> BSc.
                    <input type="checkbox" name="degree" value="MSc" onblur="checkDegree()"> MSc.
                </td>
                <td></td>
            </tr>

            <tr>
                <td>Photo</td>
                <td colspan="2"><input type="file" id="photo" onblur="checkPhoto()"></td>
            </tr>

            <tr>
                <td colspan="3" height="45"></td>
            </tr>

            <tr>
                <td colspan="3" align="right">
                    <input type="submit" value="Submit">
                    <input type="reset" value="Reset">
                </td>
            </tr>

        </table>

        <p id="error" style="color:red;"></p>

    </form>

    <script>
        // check name
        function checkName() {
            let error = document.getElementById('error');
            let name = document.getElementById('name').value.trim();

            if (name === "") {
                error.innerHTML = "Name cannot be empty";
                return false;
            }

            let words = name.split(" ");
            if (words.length < 2 || words[0] === "" || words[1] === "") {
                error.innerHTML = "Name must contain at least two words";
                return false;
            }

            let firstChar = name.charAt(0);
            if (!((firstChar >= 'A' && firstChar <= 'Z') || (firstChar >= 'a' && firstChar <= 'z'))) {
                error.innerHTML = "Name must start with a letter";
                return false;
            }

            for (let i = 0; i < name.length; i++) {
                let ch = name.charAt(i);
                if (ch === " " || (ch >= 'A' && ch <= 'Z') || (ch >= 'a' && ch <= 'z') || ch === '.' || ch === '-') {
                    continue;
                }
                error.innerHTML = "Name contains invalid characters";
                return false;
            }

            error.innerHTML = "";
            return true;
        }

        // check email
        function checkEmail() {
            let error = document.getElementById('error');
            let email = document.getElementById('email').value;

            if (email === "") {
                error.innerHTML = "Email cannot be empty";
                return false;
            }

            let at = email.indexOf("@");
            let dot = email.indexOf(".", at + 1);

            if (at === -1 || at === 0) {
                error.innerHTML = "Invalid email format";
                return false;
            }

            if (dot === -1 || dot === email.length - 1) {
                error.innerHTML = "Invalid email format";
                return false;
            }

            error.innerHTML = "";
            return true;
        }

        // check gender
        function checkGender() {
            let error = document.getElementById('error');
            let genders = document.getElementsByName('gender');
            for (let i = 0; i < genders.length; i++) {
                if (genders[i].checked) {
                    error.innerHTML = "";
                    return true;
                }
            }
            error.innerHTML = "Please select a gender";
            return false;
        }

        // check dob
        function checkDOB() {
            let error = document.getElementById('error');
            let dd = document.getElementById('day').value;
            let mm = document.getElementById('month').value;
            let yy = document.getElementById('year').value;

            if (dd === "" || mm === "" || yy === "") {
                error.innerHTML = "Date of Birth fields cannot be empty";
                return false;
            }

            if (isNaN(dd) || isNaN(mm) || isNaN(yy)) {
                error.innerHTML = "DOB must contain numeric values only";
                return false;
            }

            dd = Number(dd);
            mm = Number(mm);
            yy = Number(yy);

            if (dd < 1 || dd > 31) {
                error.innerHTML = "Day must be between 1 and 31";
                return false;
            }

            if (mm < 1 || mm > 12) {
                error.innerHTML = "Month must be between 1 and 12";
                return false;
            }

            if (yy < 1900 || yy > 2016) {
                error.innerHTML = "Year must be between 1900 and 2016";
                return false;
            }

            error.innerHTML = "";
            return true;
        }

        // check blood group
        function checkBG() {
            let error = document.getElementById('error');
            let bg = document.getElementById('blood_group').value;
            if (bg === "") {
                error.innerHTML = "Please select a blood group";
                return false;
            }
            error.innerHTML = "";
            return true;
        }

        // check degree
        function checkDegree() {
            let error = document.getElementById('error');
            let degrees = document.getElementsByName('degree');
            for (let i = 0; i < degrees.length; i++) {
                if (degrees[i].checked) {
                    error.innerHTML = "";
                    return true;
                }
            }
            error.innerHTML = "Select at least one degree";
            return false;
        }

        // check photo
        function checkPhoto() {
            let error = document.getElementById('error');
            let photo = document.getElementById('photo').value;
            if (photo === "") {
                error.innerHTML = "Please upload a photo";
                return false;
            }
            error.innerHTML = "";
            return true;
        }

        // final submit validation
        function validate() {
            if (!checkName()) return false;
            if (!checkEmail()) return false;
            if (!checkGender()) return false;
            if (!checkDOB()) return false;
            if (!checkBG()) return false;
            if (!checkDegree()) return false;
            if (!checkPhoto()) return false;
            return true;
        }
    </script>

</body>

</html>
